name: Golem PocketMine-MP Tests
description: Run integration tests for a PocketMine-MP plugin on a real server, with simulated players.
author: Achedon12

branding:
  icon: check-square
  color: green

inputs:
  path:
    description: Folder of the plugin to test (the one containing plugin.yml).
    default: .
  tests:
    description: Tests folder, relative to the plugin. Defaults to composer.json extra.golem.tests, then "tests".
    default: ''
  pocketmine:
    description: PocketMine-MP version to test against, e.g. 5.44.3, or a fork as owner/repository[@tag]. Defaults to composer.json extra.golem.pocketmine, then the latest release.
    default: ''
  filter:
    description: Only run tests whose Class::method contains this text.
    default: ''
  junit:
    description: Where to write the JUnit XML report. Empty to skip it.
    default: golem-junit.xml
  parallel:
    description: Number of servers to split the tests between. GitHub's runners have 4 cores.
    default: '1'

runs:
  using: composite
  steps:
    # One cache per PocketMine-MP source, never shared between them: a run executes the
    # server it downloads, and a fork's code must not be able to tamper with what other
    # runs restore (the PHP build, pmmp's phar...).
    - name: Cache PocketMine-MP and its PHP build
      uses: actions/cache@v6
      with:
        path: ~/.cache/golem
        key: golem-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.pocketmine || 'latest' }}

    - name: Run Golem
      shell: bash
      env:
        GOLEM_PATH: ${{ inputs.path }}
        GOLEM_TESTS: ${{ inputs.tests }}
        GOLEM_POCKETMINE: ${{ inputs.pocketmine }}
        GOLEM_FILTER: ${{ inputs.filter }}
        GOLEM_JUNIT: ${{ inputs.junit }}
        GOLEM_PARALLEL: ${{ inputs.parallel }}
      run: |
        args=(run --path="$GOLEM_PATH")
        [ -n "$GOLEM_TESTS" ] && args+=(--tests="$GOLEM_TESTS")
        [ -n "$GOLEM_POCKETMINE" ] && args+=(--pocketmine="$GOLEM_POCKETMINE")
        [ -n "$GOLEM_FILTER" ] && args+=(--filter="$GOLEM_FILTER")
        [ -n "$GOLEM_JUNIT" ] && args+=(--log-junit="$GOLEM_JUNIT")
        [ -n "$GOLEM_PARALLEL" ] && [ "$GOLEM_PARALLEL" != "1" ] && args+=(--parallel="$GOLEM_PARALLEL")
        php "$GITHUB_ACTION_PATH/bin/golem" "${args[@]}"
