name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']

permissions:
  contents: read

jobs:
  example:
    name: Example plugin (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # the summary comment of the action
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Run the example tests with the action
        uses: ./
        with:
          path: examples/hello-world
          parallel: 4
          report-html: golem-report-php-${{ matrix.php }}.html
          comment: ${{ matrix.php == '8.4' }}

      - name: Test the /golem server plugin with Golem itself
        uses: ./
        with:
          path: .
          junit: golem-self-junit.xml

      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports-php-${{ matrix.php }}
          path: |
            golem-*junit.xml
            golem-report-*.html
          if-no-files-found: ignore

  fork:
    name: Fork compatibility (Plutonium)
    runs-on: ubuntu-latest
    # Informational: a broken release of a third-party fork must not block Golem.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Golem's own tests on the latest Plutonium release
        uses: ./
        with:
          path: .
          pocketmine: Plutonium-Mcpe/PocketMine-MP
          junit: ''

  analyse:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --ignore-platform-reqs

      - name: Download the PocketMine PHP build
        # PHPStan needs PocketMine's extensions (encoding, pmmpthread...) to know their classes.
        # Running the tests once is the simplest way to get that PHP build.
        run: php bin/golem --path=examples/hello-world

      - name: Fuzz the example plugin
        run: php bin/golem fuzz --path=examples/hello-world --duration=15 --seed=1

      - name: Benchmark the example plugin
        run: php bin/golem bench --path=examples/hello-world --players=20 --duration=15

      - name: Mutation testing of the example plugin
        run: php bin/golem mutate --path=examples/hello-world --workers=4 --max=8

      - name: Analyse
        run: ~/.cache/golem/php/8.4-Linux-x86_64/bin/php7/bin/php vendor/bin/phpstan analyse --memory-limit=1G --no-progress
