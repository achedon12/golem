name: Docs

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/docs.yml', '.github/scripts/build-docs.py', '.github/scripts/build-wiki.py']
  # after a release, run it on main so the new tag becomes the docs at the root and in the wiki
  # (GitHub Pages only deploys from main)
  workflow_dispatch:

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  site:
    name: Build the website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main        # main under next/, and today's configuration for every version
          fetch-depth: 0   # every release tag, and "last updated" dates from git history

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        working-directory: docs
        run: npm ci

      - name: Build every version
        run: python3 .github/scripts/build-docs.py site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  wiki:
    name: Sync the wiki
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0   # the docs of every release tag

      - name: Check out the wiki
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Generate the pages from the docs of every release
        run: python3 .github/scripts/build-wiki.py . wiki

      - name: Publish
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
          else
            git commit -m "Sync from docs at ${GITHUB_SHA::7}"
            git push
          fi
